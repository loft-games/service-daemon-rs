name: Rust CI

on:
  workflow_dispatch:
  push:
    branches: [ "master", "develop", "feat/**" ]
  pull_request:
    branches: [ "master", "develop", "feat/**" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Check
        run: cargo check --workspace
      - name: Rust Check All Features
        run: cargo check --workspace --all-features
      - name: Rust Check Diagnostics Example
        run: cargo check -p example-diagnostics
      - name: Rust Check No Default Features
        run: cargo check -p service-daemon --no-default-features

  benchmarks:
    name: Framework benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      BENCH_REPORT_ROOT: ${{ github.workspace }}/target/criterion/ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test benchmark report adapter
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_framework_benchmark_report.py'
      - name: Record measurement environment
        id: environment
        run: python3 .github/scripts/framework_benchmark_report.py capture "$BENCH_REPORT_ROOT"
      - name: Build framework benchmarks
        run: cargo bench --locked -p service-daemon --bench framework --no-run
      - name: Smoke framework benchmarks
        run: cargo bench --locked -p service-daemon --bench framework -- --test
      - name: Build HighPriority framework benchmarks
        run: cargo bench --locked -p service-daemon --bench framework --features high-priority --no-run
      - name: Smoke HighPriority framework benchmarks
        run: cargo bench --locked -p service-daemon --bench framework --features high-priority -- --test
      - name: Measure framework benchmarks
        id: measure_default
        timeout-minutes: 15
        env:
          CRITERION_HOME: ${{ env.BENCH_REPORT_ROOT }}/default
        run: cargo bench --locked -p service-daemon --bench framework -- --noplot 2>&1 | tee "$BENCH_REPORT_ROOT/default.log"
      - name: Measure HighPriority framework benchmarks
        id: measure_hp
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        timeout-minutes: 15
        env:
          CRITERION_HOME: ${{ env.BENCH_REPORT_ROOT }}/high-priority
        run: cargo bench --locked -p service-daemon --bench framework --features high-priority -- --noplot 2>&1 | tee "$BENCH_REPORT_ROOT/high-priority.log"
      - name: Publish benchmark summary
        if: always()
        run: |
          python3 .github/scripts/framework_benchmark_report.py report "$BENCH_REPORT_ROOT" \
            --default-status '${{ steps.measure_default.outcome }}' \
            --high-priority-status '${{ steps.measure_hp.outcome }}'
      - name: Upload benchmark report and raw results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: framework-benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BENCH_REPORT_ROOT }}/
          retention-days: 30
          if-no-files-found: error

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check file logging example
        run: cargo check -p example-logging
      - name: Check simulation example
        run: cargo check -p example-simulation
      - name: Run tests
        run: cargo test --workspace
      - name: Run tests with all features
        run: cargo test --workspace --all-features
      - name: Run service-daemon tests without default features
        run: cargo test -p service-daemon --no-default-features
      # Release-mode smoke against linker section GC (see linkme_smoke.rs).
      # Catches rustc/LLVM upgrades that silently drop #[service] entries
      # before they can mask service-discovery failures in production builds.
      - name: Linkme smoke (release)
        run: cargo test -p service-daemon --release --test linkme_smoke

  deny:
    name: Dependency Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache advisory database
        uses: actions/cache@v6
        with:
          path: ~/.cargo/advisory-dbs
          key: cargo-deny-advisory-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            cargo-deny-advisory-db-${{ runner.os }}-
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --force
      - name: Cargo Deny
        run: cargo deny --locked check

  linkme-platforms:
    name: Linkme platform smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: host
            target_arg: ""
            label: Linux GNU
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            target_arg: --target x86_64-pc-windows-msvc
            label: Windows MSVC
          - os: macos-latest
            target: host
            target_arg: ""
            label: macOS
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            target_arg: --target x86_64-unknown-linux-musl
            label: Linux musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install musl C toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          command -v musl-gcc
          musl-gcc --version
          {
            echo 'CC_x86_64_unknown_linux_musl=musl-gcc'
            echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc'
          } >> "$GITHUB_ENV"
      - name: Install Rust (${{ matrix.target }})
        shell: bash
        run: bash .github/scripts/install-rust-toolchain stable "${{ matrix.target }}" llvm-tools-preview
      - name: Linkme smoke (${{ matrix.label }})
        run: cargo test ${{ matrix.target_arg }} --release -p service-daemon --test linkme_smoke
      - name: Inspect linkme registry sections (${{ matrix.label }})
        shell: bash
        run: bash .github/scripts/check-linkme-registry-sections "${{ matrix.target }}"

  named-pipe-msvc:
    name: Windows local IPC providers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust (x86_64-pc-windows-msvc)
        shell: bash
        run: bash .github/scripts/install-rust-toolchain stable x86_64-pc-windows-msvc
      - name: Run Windows local IPC provider tests
        shell: bash
        run: bash .github/scripts/run-windows-named-pipe-provider-tests

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust Format Check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Rust Clippy All Features
        run: cargo clippy --workspace --all-features -- -D warnings
      - name: Rust Clippy No Default Features
        run: cargo clippy -p service-daemon --no-default-features -- -D warnings
