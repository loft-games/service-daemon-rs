[package]
name = "service-daemon"
version = "0.1.0-alpha.5"
edition = "2024"
rust-version = "1.91"
description = "A declarative Rust framework for automatic service management, event-driven triggers, and compile-time dependency injection."
license = "MIT OR Apache-2.0"
repository = "https://github.com/loft-games/service-daemon-rs"
keywords = ["daemon", "supervisor", "lifecycle", "dependency-injection", "tokio"]
categories = ["asynchronous", "rust-patterns"]
readme = "../README.md"

[features]
default = ["cron"]
# Enable cron-based triggers (uses tokio-cron-scheduler)
cron = ["dep:tokio-cron-scheduler"]
# Enable simulation/testing support (MockContext, SimulationOverlay, log drain).
# This feature excludes debugging utilities from production builds.
simulation = []
# Enable file-based log persistence with rotation (uses tracing-appender)
file-logging = ["dep:tracing-appender", "dep:serde_json"]
# Enable runtime behavioral topology collection and visualization.
# Gates the topology collector service; message_id generation is always-on.
diagnostics = []

[dependencies]
service-daemon-macro = { version = "0.1.0-alpha.5", path = "../service-daemon-macro" }
tokio = { version = "1.53.0", features = ["full", "tracing"] }
tokio-cron-scheduler = { version = "0.15.1", optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
thiserror = "2.0.19"
futures = "0.3.33"
linkme = "0.3.37"
uuid = { version = "1.24.0", features = ["v7", "serde"] }
tokio-util = "0.7.18"
rand = "0.10.2"
dashmap = "6.2.1"
parking_lot = "0.12.5"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
tracing-appender = { version = "0.2.5", optional = true }
serde_json = { version = "1.0.150", optional = true }
petgraph = "0.8.3"
