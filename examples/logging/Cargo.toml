[package]
name = "example-logging"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Logging example: demonstrates file-based log persistence with JSON rotation."

[dependencies]
service-daemon = { path = "../../service-daemon", features = [
    "file-logging",
] }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.102"
