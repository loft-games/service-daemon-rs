[package]
name = "example-memory-analysis"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Memory overhead analysis: measures per-service RSS delta and struct sizes."

[features]
# Enable compile-time size guard assertions in this example.
memory-analysis = []

[dependencies]
service-daemon = { path = "../../service-daemon" }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.102"
pastey = "0.2.3"
libc = "0.2.186"
tokio-util = "0.7.18"
dashmap = "6.2.1"
futures = "0.3.32"
