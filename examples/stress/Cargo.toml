[package]
name = "example-stress"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Stress test: bulk service registration via macro expansion."

[features]
default = []
s0 = []
s50 = ["s0"]
s100 = ["s50"]
s150 = ["s100"]
s200 = ["s150"]
s300 = ["s200"]
s400 = ["s300"]
s500 = ["s400"]
s600 = ["s500"]
s700 = ["s600"]
s800 = ["s700"]
s900 = ["s800"]
s1000 = ["s900"]

[dependencies]
service-daemon = { path = "../../service-daemon" }
tokio = { version = "1.53.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
pastey = "0.2.3"
