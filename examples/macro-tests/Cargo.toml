[package]
name = "example-macro-tests"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Compile-time macro verification: trybuild pass/fail tests for #[service], #[trigger], and #[provider]."

[dependencies]
service-daemon = { path = "../../service-daemon", features = [
    "cron",
    "simulation",
    "high-priority",
] }
tokio = { version = "1.53.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"

[dev-dependencies]
trybuild = "1.0.116"
