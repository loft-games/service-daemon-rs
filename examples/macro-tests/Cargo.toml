[package]
name = "example-macro-tests"
version = "0.1.0"
edition = "2024"
publish = false
description = "Compile-time macro verification: trybuild pass/fail tests for #[service], #[trigger], and #[provider]."

[dependencies]
service-daemon = { path = "../../service-daemon", features = [
    "cron",
    "simulation",
] }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.102"

[dev-dependencies]
trybuild = "1.0.116"
