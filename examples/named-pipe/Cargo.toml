[package]
name = "example-named-pipe"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Windows named pipe example: listener and connector provider templates."

[dependencies]
service-daemon = { path = "../../service-daemon" }
tokio = { version = "1.53.0", features = ["full"] }
tracing = "0.1.44"
anyhow = "1.0.104"
bytes = "1.11.0"
futures-util = { version = "0.3.33", features = ["sink"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
