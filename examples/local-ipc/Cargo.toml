[package]
name = "example-local-ipc"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Cross-platform local IPC example: logical-name listener and connector provider templates."

[dependencies]
service-daemon = { path = "../../service-daemon" }
tokio = { version = "1.53.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
