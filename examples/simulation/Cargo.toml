[package]
name = "example-simulation"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Simulation example: demonstrates MockContext for unit testing services without a real daemon."

[dependencies]
service-daemon = { path = "../../service-daemon", features = [
    "simulation",
] }
tokio = { version = "1.53.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
