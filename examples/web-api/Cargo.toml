[package]
name = "example-web-api"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Neutral Web API example: Axum service, listener provider, and maintenance trigger."

[dependencies]
service-daemon = { path = "../../service-daemon" }
tokio = { version = "1.53.1", features = ["full"] }
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["cors"] }
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
anyhow = "1.0.104"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }

[features]
default = []
devtools = []
docs = ["devtools"]

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
serde_json = "1.0.151"
