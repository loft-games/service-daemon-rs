[package]
name = "example-web-api"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Neutral Web API example: Axum service, listener provider, and maintenance trigger."

[dependencies]
service-daemon = { path = "../../service-daemon" }
tokio = { version = "1.52.3", features = ["full"] }
axum = "0.8.4"
tower-http = { version = "0.6.6", features = ["cors"] }
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.44"
anyhow = "1.0.102"
utoipa = "5.4.0"
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

[features]
default = []
devtools = []
docs = ["devtools"]

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
serde_json = "1.0.150"
