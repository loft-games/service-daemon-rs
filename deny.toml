[advisories]
unused-ignored-advisory = "deny"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is pulled only through example-web-api -> utoipa-axum 0.2.0, with no patched utoipa-axum release currently available; temporary example-only exception." },
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
  "https://github.com/rust-lang/crates.io-index",
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
]
